name: Push DB Migrations

# Migrations are the one piece Supabase's GitHub integration does NOT apply
# automatically: CI's migration-assertions job only proves the chain works on a
# throwaway local instance. This workflow applies it to the PRODUCTION project
# and must be started by a human (workflow_dispatch only — never on push).
#
# Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN (or CRI) — a Supabase access token
#   SUPABASE_DB_PASSWORD          — the project's Postgres password
#     (Database → Connect → Session pooler password, or the DB password)

on:
  workflow_dispatch:

# Least privilege: this job authenticates to Supabase with the
# SUPABASE_ACCESS_TOKEN secret, not GITHUB_TOKEN, so read-only contents is
# sufficient.
permissions:
  contents: read

jobs:
  db-push:
    name: Push migrations to production
    runs-on: ubuntu-latest

    # The password is supplied through the environment, never on argv. The
    # Supabase CLI reads SUPABASE_DB_PASSWORD itself, so there is no reason to
    # put the production database password on a command line — where it is
    # visible in /proc/<pid>/cmdline to anything on the runner, captured by
    # any crash dump, and persisted by the CLI into supabase/.temp/.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRI || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: beetszutyuihbnzzmokr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.33.9

      - name: Verify access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Neither the CRI nor the SUPABASE_ACCESS_TOKEN repo secret is set."
            exit 1
          fi

      # Link first: the direct db.<ref>.supabase.co host is IPv6-only and GitHub's
      # runners (and many corporate networks) have no IPv6 route. Linking records
      # the IPv4 session-pooler endpoint, which db push then uses.
      - name: Link to production project (IPv4 pooler)
        run: supabase link --project-ref "$PROJECT_ID"

      # Read-only first: print exactly which migrations the production database
      # already has versus the local chain, so db push decisions are informed.
      # db push refuses (by design) to insert local files older than the remote's
      # newest recorded version unless --include-all is passed; seeing the actual
      # remote state tells us whether that is safe.
      - name: Show migration status (local vs production)
        run: supabase migration list

      # A dry run first. This job applies to PRODUCTION, and the production
      # database's recorded history skips a block of files from 2026-09-28/30
      # (suite-split UUID renames) that --include-all re-applies in timestamp
      # order. The dry run prints the exact set that would be applied, so a
      # human can see it before it happens rather than after.
      - name: Dry run — show exactly what would be applied
        run: |
          echo "::group::Pending migrations against production"
          supabase db push --include-all --dry-run
          echo "::endgroup::"
          echo "Review the list above. If anything unexpected appears, stop here and reconcile the migration history before pushing."

      # Production's recorded history skips 14 files from 2026-09-28/30 (suite-split
      # UUID renames that left different filename versions than the ones recorded
      # on the linked DB). --include-all applies them in timestamp order.
      #
      # Two of those files were destructive on this path and have since been made
      # safe to re-apply: the legacy teardown now refuses to drop a populated
      # table (it used to remove the live messages, notifications and reports
      # tables, whose recreating migrations are already recorded and would
      # therefore never run again), and the duplicate foreign-key file now adds
      # a key only when it is genuinely absent and no live row would violate it.
      #
      # STILL: take a snapshot first, and read the dry-run output above.
      - name: Push migrations
        run: supabase db push --include-all
