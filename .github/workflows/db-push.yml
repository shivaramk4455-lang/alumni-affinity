name: Push DB Migrations

# Migrations are the one piece Supabase's GitHub integration does NOT apply
# automatically: CI's migration-assertions job only proves the chain works on a
# throwaway local instance. This workflow applies it to the PRODUCTION project
# and must be started by a human (workflow_dispatch only — never on push).
#
# Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN (or CRI) — a Supabase access token
#   SUPABASE_DB_PASSWORD          — the project's Postgres password
#     (Database → Connect → Session pooler password, or the DB password)

on:
  workflow_dispatch:

jobs:
  db-push:
    name: Push migrations to production
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRI || secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: beetszutyuihbnzzmokr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Neither the CRI nor the SUPABASE_ACCESS_TOKEN repo secret is set."
            exit 1
          fi

      # Link first: the direct db.<ref>.supabase.co host is IPv6-only and GitHub's
      # runners (and many corporate networks) have no IPv6 route. Linking records
      # the IPv4 session-pooler endpoint, which db push then uses.
      - name: Link to production project (IPv4 pooler)
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Read-only first: print exactly which migrations the production database
      # already has versus the local chain, so db push decisions are informed.
      # db push refuses (by design) to insert local files older than the remote's
      # newest recorded version unless --include-all is passed; seeing the actual
      # remote state tells us whether that is safe.
      - name: Show migration status (local vs production)
        run: supabase migration list

      # Production's recorded history skips 14 files from 2026-09-28/30 (suite-split
      # UUID renames that left different filename versions than the ones recorded
      # on the linked DB). --include-all applies them in timestamp order. Verified
      # safe BEFORE this runs: every CREATE mirrors a matching DROP IF EXISTS or
      # uses IF NOT EXISTS / OR REPLACE, every INSERT carries ON CONFLICT, the
      # demo seed is deleted by 20261010's cleanup on the same run, and the exact
      # selection is proven clean on a fresh DB by the CI migration-drill job.
      - name: Push migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
