name: CI Gates

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

# Least privilege: every job only checks out the repository. Nothing here needs
# a writable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  static-gates:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This repository once carried a second, contradictory migration chain
      # under drizzle/: its 0001 used CREATE OR REPLACE VIEW against a view the
      # Supabase chain DROPs first (so it would fail on a migrated database),
      # its 0003 added the consent-purpose CHECK as NOT VALID — strictly weaker
      # than the shipped constraint — and its 0005 dropped the FK-regression
      # assertions. It was dead weight as well as wrong: drizzle/schema.ts was
      # intentionally blank and nothing imported drizzle-orm at runtime.
      #
      # The guard exists because the Lovable editor can regenerate the folder,
      # and a silently reintroduced second schema source of truth is worse than
      # no schema at all. It runs before install so a resurrection fails fast.
      - name: Guard against a resurrected drizzle migration chain
        run: |
          fail=0
          if [ -e drizzle ]; then
            echo "::error::drizzle/ is back. supabase/migrations/ is the only migration source of truth — delete it or reconcile it there."
            fail=1
          fi
          if [ -e drizzle.config.ts ]; then
            echo "::error::drizzle.config.ts is back. drizzle-kit must not be runnable against this project (it would propose dropping every table)."
            fail=1
          fi
          if grep -qE '"drizzle-(kit|orm)"' package.json; then
            echo "::error::drizzle-kit/drizzle-orm are back in package.json."
            fail=1
          fi
          # The same guard for the bun lockfile. package.json was the only
          # thing checked, so a `bun install` could reintroduce the tool that
          # the guard exists to prevent. The pattern matches the resolved
          # package entries, not the optional-peer references inside db0.
          if grep -qE '"(drizzle-kit|drizzle-orm)": \[' bun.lock; then
            echo "::error::drizzle-kit/drizzle-orm are back in bun.lock — a bun install reintroduced them."
            fail=1
          fi
          # Every package must resolve from the public registry. bun.lock
          # resolved 142 packages from a private Lovable GCS mirror, so a
          # contributor's `bun install` would pull from infrastructure this
          # repository does not control.
          if grep -q 'lovable-core-prod/sandbox-npm-cache' bun.lock; then
            echo "::error::bun.lock resolves packages from a private Lovable GCS mirror instead of https://registry.npmjs.org."
            fail=1
          fi
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Check line endings are LF
        run: node scripts/normalize-eol.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (coverage thresholds enforced)
        # The thresholds live in vitest.config.ts. Without them a coverage
        # number is decoration: a security-critical module could quietly lose
        # its tests and the build would still be green.
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  # The legal-identity release gate now lives in its own workflow
  # (.github/workflows/legal-gate.yml) so that THIS file can be green and used
  # as a required status check. See that file for why.
  #
  # The reason it had to move: a job that is red by design makes the whole
  # workflow red, and a workflow that is always red cannot be required. A branch
  # protection rule cannot distinguish "expected red" from "your test broke", so
  # keeping it here would have trained everyone to ignore a failing CI.

  migration-assertions:
    name: SQL Migrations & Regressions Drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase test instance
        run: supabase start

      - name: Reset database (applies all migrations including regression assertions)
        run: supabase db reset

      - name: Verify migration status (clean chain)
        run: supabase migration list --local

  functions-typecheck:
    name: Edge function typecheck (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tsconfig.json covers src/**, vite.config.ts and eslint.config.js only, so
      # the nine edge functions — including the Razorpay webhook that decides
      # entitlements and the delete-account handler — were never typechecked by
      # anything. `supabase functions deploy` bundles with esbuild, which does
      # not typecheck either.
      #
      # Deliberately NOT wired as a hard gate on deploy-functions.yml yet: a gate
      # that fails on its first run would block a critical deploy. Read the
      # first run's output, fix what it finds, then make it blocking.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: |
          deno check \
            supabase/functions/_shared/*.ts \
            supabase/functions/*/index.ts

      - name: Lint edge functions
        # REPORTED, not yet a hard gate: `deno lint` is new to this repository
        # and this step has no green history yet. It runs on every PR so the
        # finding count is visible; promote it to blocking once it reports zero
        # (delete the `continue-on-error` line). `supabase functions deploy`
        # bundles without typechecking OR linting, so this job and the lint
        # step are the only things standing between a lint error and the
        # payment path.
        continue-on-error: true
        run: deno lint supabase/functions/
